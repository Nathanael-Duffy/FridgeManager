<html lang="en">

    <meta charset="UTF-8">

    <title>Scan Item - Fridge Manager</title>
    <link rel="stylesheet" href="/gui/style.css">
    <link rel="stylesheet" href="/gui/scan.css">
</head>

<body>

<header>
    <div>
        <h1>Fridge Manager</h1>
        <p class="subtitle">Smart Fridge & Freezer</p>
    </div>

    <div class="connection">
        <span class="dot"></span>
        System Online
    </div>
</header>

<main class="scan-page">

    <section class="card scan-card">

        <h2>Scan Item</h2>

        <p class="scan-instruction" id="scan-instruction">
            Place an NFC tag on the reader and press Scan.
        </p>

        <button id="scan-button" type="button">
            Scan NFC Tag
        </button>

        <div id="scan-result" class="scan-result hidden"></div>

    </section>

</main>
